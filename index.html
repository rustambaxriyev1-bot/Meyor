<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Меъёр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone column. A cobalt brand band with a rhombus motif on top, tap rows below, tab bar pinned at the bottom. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#14202E; --muted:#4B5B6E; --line:#D3DCE6;
  --accent:#17508A; --accent-ink:#FFFFFF; --tint:#E3EDF7; --hot:#B4232A; --hot-tint:#FBE9E7;
  --brand:#123E6E; --brand-ink:#FFFFFF; --brand-soft:#C9DDF2;
  --gold:#F2B544; --gold-ink:#3A2A00; --h1:#B5CFEA; --h2:#5E95CF; --leaf:#2E9E5B; --shadow:0 1px 2px rgba(20,32,46,.05),0 8px 24px rgba(20,32,46,.08);
  --display:"Montserrat","Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141C; --surface:#162029; --ink:#E8EEF5; --muted:#A6B4C3; --line:#2A3745;
    --accent:#7DB7F0; --accent-ink:#0D141C; --tint:#1C2C3D; --hot:#F28B82; --hot-tint:#3A1F1E;
    --brand:#15324F; --brand-ink:#FFFFFF; --brand-soft:#B9D3EE; --shadow:none; --h1:#27425F; --h2:#3F6FA3; --leaf:#4CC27C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141C; --surface:#162029; --ink:#E8EEF5; --muted:#A6B4C3; --line:#2A3745;
  --accent:#7DB7F0; --accent-ink:#0D141C; --tint:#1C2C3D; --hot:#F28B82; --hot-tint:#3A1F1E;
  --brand:#15324F; --brand-ink:#FFFFFF; --brand-soft:#B9D3EE; --shadow:none; --h1:#27425F; --h2:#3F6FA3; --leaf:#4CC27C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
main{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
main>*{flex:none}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;text-wrap:balance}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:16px}
.muted{color:var(--muted);font-size:14px}
.band{position:relative;overflow:hidden;border-radius:22px;background:var(--brand);color:var(--brand-ink);padding:20px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.band .motif{position:absolute;right:-10px;top:0;height:120px;width:150px;opacity:.3}
.band>*:not(.motif){position:relative}
.wordmark{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:3px;text-transform:uppercase;line-height:1}
.band.big .wordmark{font-size:44px}
.band.big{padding:28px 20px}
.band.big .slogan{font-size:16px}
.slogan{font-size:14px;font-weight:600;color:var(--brand-soft)}
.band .hello{font-size:17px;font-weight:600;margin-top:10px;text-wrap:balance}
.hrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:16px;background:rgba(255,255,255,.16);font-weight:600;font-size:13px}
.dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.dot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--brand-soft)}
.dot i{display:block;width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.4)}
.dot.part i{background:rgba(255,255,255,.4)}
.dot.full i{background:var(--gold);border-color:var(--gold)}
.dot.fut i{border-style:dashed;opacity:.5}
.dot.now i{box-shadow:0 0 0 2px var(--brand),0 0 0 4px #FFFFFF}
.dot.now{color:#FFFFFF}
.streak{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:16px;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card.done{--ink:#3A2A00;--muted:#3A2A00;--tint:rgba(58,42,0,.16);--accent:#3A2A00;background:var(--gold);border-color:var(--gold);color:#3A2A00}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn:disabled{opacity:.35}
.pillbtn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cta{min-height:52px;font-size:17px;font-weight:700;width:100%}
.summary{display:flex;align-items:center;gap:16px}
.ring{flex:none}
.big{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tick{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;text-align:left;padding:8px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tick[aria-pressed="true"]{background:var(--tint);border-color:var(--accent)}
.tick .box{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.tick[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.tick .box svg{display:none}
.tick[aria-pressed="true"] .box svg{display:block}
.tick .lab{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 0}
.tick.next{border:2px solid var(--accent)}
.tick.next .k{color:var(--accent)}
.mi{flex:none;width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--accent);display:grid;place-items:center}
.tick[aria-pressed="true"] .mi{background:var(--surface)}
.tick .k{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.tick .v{font-size:15px;overflow-wrap:anywhere}
.tag{font-weight:700;color:var(--hot)}
.bar{height:10px;border-radius:5px;background:var(--tint);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px}
.field{display:flex;gap:8px;align-items:center}
.field input{flex:1 1 0;min-width:0}
.field input,.inp{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.inp.text{font-size:15px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--hot-tint);border-color:var(--hot);color:var(--hot)}
.chip.good[aria-pressed="true"]{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:18px;font-size:13px;font-weight:700;border:1px dashed var(--line);color:var(--muted)}
.badge.on{border:1px solid var(--accent);background:var(--tint);color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:44px}
.wd:disabled{opacity:.45}
.wd.sel{border-color:var(--accent);background:var(--tint)}
.wd .col{width:14px;height:64px;border-radius:7px;background:var(--tint);display:flex;align-items:flex-end;overflow:hidden}
.wd.sel .col{background:var(--surface)}
.wd .col i{display:block;width:100%;background:var(--accent);border-radius:7px}
.wd b{font-size:12px}
.wd span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.stat:first-of-type{border-top:0}
.state{font-size:13px;font-weight:700;padding:4px 10px;border-radius:12px;background:var(--tint);color:var(--accent);white-space:nowrap}
.state.over{background:var(--hot-tint);color:var(--hot)}
.note{padding:10px 12px;border-radius:12px;background:var(--tint);font-size:14.5px;overflow-wrap:anywhere}
.err{padding:10px 12px;border-radius:12px;background:var(--hot-tint);color:var(--hot);font-size:14px;font-weight:600}
.proverb{font-family:var(--display);font-weight:700;font-size:15px;text-align:center;color:var(--accent);padding:4px 8px;text-wrap:balance}
.menuday{display:flex;flex-direction:column;gap:6px}
.menuday dl{margin:0;display:grid;grid-template-columns:92px minmax(0,1fr);gap:4px 10px;font-size:14.5px}
.menuday dt{color:var(--muted);font-weight:600}
.menuday dd{margin:0;overflow-wrap:anywhere}
.today-mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--accent);color:var(--accent-ink)}
form{display:flex;flex-direction:column;gap:14px;margin:0}
.fg{display:flex;flex-direction:column;gap:6px}
.fg>label,.fg>.lbl{font-size:14px;font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;gap:8px}
.seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg label{position:relative;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;cursor:pointer;padding:4px 6px;text-align:center}
.seg label.on{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.checkrow{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.checkrow input{flex:none;width:24px;height:24px;margin:0;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv>div{padding:10px 12px;border-radius:12px;background:var(--tint);display:flex;flex-direction:column;gap:2px}
.kv b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.kv span{font-size:13px;color:var(--muted)}
.treerow{display:flex;align-items:center;gap:14px}
.tree{flex:none}
.tree .canopy{transform-box:view-box;transform-origin:80px 160px;animation:sway 5s ease-in-out infinite}
.tree.wilt .canopy{animation:none;transform:rotate(5deg)}
.tree .pop{transform-box:fill-box;transform-origin:center;animation:pop .6s ease-out}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.tree .canopy,.tree .pop{animation:none}}
.minipills{display:flex;flex-wrap:wrap;gap:6px}
.mp{padding:4px 10px;border-radius:12px;background:var(--tint);font-size:13px;font-weight:600}
.gauge{display:block;margin:0 auto}
.pt{display:grid;grid-template-columns:118px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:13px}
.pt span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.dns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dn{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.dn b{font-size:13px}
.dn span{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-template-columns:22px repeat(16,minmax(0,1fr));gap:3px;align-items:center}
.heat b{font-size:10px;font-weight:600;color:var(--muted)}
.heat i{display:block;aspect-ratio:1;border-radius:4px;background:var(--tint)}
.heat i.s1{background:var(--h1)}.heat i.s2{background:var(--h2)}.heat i.s3{background:var(--accent)}.heat i.s4{background:var(--gold)}
.heat i.fut{background:none;border:1px dashed var(--line)}
.heat i.now{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--tint)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts>div{padding:8px 10px;border-radius:12px;background:var(--tint);display:flex;flex-direction:column;gap:2px}
.facts b{font-size:13.5px;overflow-wrap:anywhere}
.facts span{font-size:12px;color:var(--muted)}
.hand{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--tint)}
.hand svg{flex:none;color:var(--accent)}
.hand b{font-size:14px}
.hand span{font-size:13px;color:var(--muted);display:block}
nav{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0)}
nav[hidden]{display:none}
nav a{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
nav a[aria-current="page"]{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg text{font-family:var(--body)}
</style>
</head>

function pad(n){return n<10?"0"+n:""+n}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}

function dow(k){return (parse(k).getDay()+6)%7}
function todayKey(){return keyOf(new Date())}
function mkey(k){return "m"+k.slice(0,4)+k.slice(5,7)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function mealHtml(s){return esc(s).replace(/^(Кафе|Кўча|Ош куни|Уй):/,'<span class="tag">$1:</span>')}
function blank(){return {meals:[0,0,0,0],habits:[0,0,0,0,0],steps:0,osh:0,dough:0,gym:0,u:0}}
function getDay(k){var d=state.days[k],b=blank();if(!d)return b;for(var x in b){if(d[x]!==undefined&&d[x]!==null)b[x]=d[x]}return b}
function setDay(k,d){d.u=Date.now();state.days[k]=d;touch(mkey(k))}
function obj(o){return o&&typeof o==="object"&&!Array.isArray(o)?o:{}}
function cleanStr(s,n){return typeof s==="string"?s.replace(/\s+/g," ").trim().slice(0,n):""}
function validProfile(p){
  if(!p||typeof p!=="object")return null;
  var age=Math.round(+p.age),h=Math.round(+p.h),w0=+p.w0,goal=+p.goal,act=Math.round(+p.act);
  if(!(age>=18&&age<=90&&h>=130&&h<=220&&w0>=35&&w0<=250&&goal>=35&&goal<=250))return null;
  return {name:cleanStr(p.name,30),sex:p.sex==="f"?"f":"m",age:age,h:h,w0:w0,goal:goal,act:act>=1&&act<=3?act:1,health:!!p.health,at:+p.at||Date.now(),u:+p.u||0};
}
function normalize(o){o=obj(o);return {days:obj(o.days),weights:obj(o.weights),wu:obj(o.wu),waist:obj(o.waist),bu:obj(o.bu),profile:validProfile(o.profile),updated:+o.updated||0}}
function merge(a,b){
  var out={days:{},weights:{},wu:{},waist:{},bu:{},profile:null,updated:Math.max(a.updated||0,b.updated||0)},k;
  for(k in a.days)out.days[k]=a.days[k];
  for(k in b.days){var x=out.days[k],y=b.days[k];if(!x||(+(y&&y.u)||0)>(+(x&&x.u)||0))out.days[k]=y}
  for(k in a.weights){out.weights[k]=a.weights[k];out.wu[k]=+a.wu[k]||0}
  for(k in b.weights){if(out.weights[k]===undefined||(+b.wu[k]||0)>(out.wu[k]||0)){out.weights[k]=b.weights[k];out.wu[k]=+b.wu[k]||0}}
  for(k in a.waist){out.waist[k]=a.waist[k];out.bu[k]=+a.bu[k]||0}
  for(k in b.waist){if(out.waist[k]===undefined||(+b.bu[k]||0)>(out.bu[k]||0)){out.waist[k]=b.waist[k];out.bu[k]=+b.bu[k]||0}}
  var fa=a.profile,fb=b.profile;out.profile=fa&&fb?(fb.u>fa.u?fb:fa):(fa||fb||null);
  return out;
}
function hasData(s){return !!(s.profile||Object.keys(s.days).length||Object.keys(s.weights).length||Object.keys(s.waist).length)}

/* cloud format: one key per month, value under 4096 characters */
function bits(a,n){var s="";for(var i=0;i<n;i++)s+=a&&a[i]?"1":"0";return s}
function unbits(s,n){var a=[];s=String(s||"");for(var i=0;i<n;i++)a.push(s.charAt(i)==="1"?1:0);return a}
function monthDoc(mk,slim){
  var ym=mk.slice(1,5)+"-"+mk.slice(5,7),d={},w={},b={},k;
  for(k in state.days){if(k.slice(0,7)!==ym)continue;var x=getDay(k),o={m:bits(x.meals,4),h:bits(x.habits,5),s:x.steps,f:bits([x.osh,x.dough,x.gym],3)};if(!slim)o.u=x.u;d[k.slice(8)]=o}
  for(k in state.weights){if(k.slice(0,7)!==ym)continue;w[k.slice(8)]=slim?[+state.weights[k]]:[+state.weights[k],+state.wu[k]||0]}
  for(k in state.waist){if(k.slice(0,7)!==ym)continue;b[k.slice(8)]=slim?[+state.waist[k]]:[+state.waist[k],+state.bu[k]||0]}
  return JSON.stringify({d:d,w:w,b:b});
}
function readMonth(mk,raw,into){
  var o;try{o=obj(JSON.parse(raw))}catch(e){return}
  var ym=mk.slice(1,5)+"-"+mk.slice(5,7),d=obj(o.d),w=obj(o.w),b=obj(o.b),k;
  for(k in d){var x=obj(d[k]),f=unbits(x.f,3);into.days[ym+"-"+k]={meals:unbits(x.m,4),habits:unbits(x.h,5),steps:Math.max(0,Math.round(+x.s)||0),osh:f[0],dough:f[1],gym:f[2],u:+x.u||1}}
  for(k in w){var e=Array.isArray(w[k])?w[k]:[];into.weights[ym+"-"+k]=+e[0]||0;into.wu[ym+"-"+k]=+e[1]||1}
  for(k in b){var e2=Array.isArray(b[k])?b[k]:[];into.waist[ym+"-"+k]=+e2[0]||0;into.bu[ym+"-"+k]=+e2[1]||1}
}
function valueFor(key){
  if(key==="profile")return state.profile?JSON.stringify(state.profile):"";
  var v=monthDoc(key,false);if(v.length>4000)v=monthDoc(key,true);return v;
}
function monthKeys(s){var set={},k;for(k in s.days)set[mkey(k)]=1;for(k in s.weights)set[mkey(k)]=1;for(k in s.waist)set[mkey(k)]=1;return Object.keys(set)}

function loadLocal(){try{var r=localStorage.getItem(LS);if(r)state=normalize(JSON.parse(r))}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function touch(){state.updated=Date.now();saveLocal();for(var i=0;i<arguments.length;i++)dirtyKeys[arguments[i]]=1;if(cloud){clearTimeout(timer);timer=setTimeout(flush,800)}render()}
function flush(){
  if(!cloud)return;
  clearTimeout(timer);
  var keys=Object.keys(dirtyKeys);dirtyKeys={};
  keys.forEach(function(key){
    var v=valueFor(key);
    if(v.length>4096){setSync("local");return}
    try{cloud.setItem(key,v,function(err){if(err){dirtyKeys[key]=1;setSync("local")}else setSync("cloud")})}catch(e){dirtyKeys[key]=1;setSync("local")}
  });
}
function setSync(s){if(sync!==s){sync=s;var el=document.getElementById("sync");if(el)el.textContent=syncText()}}
function syncText(){
  if(sync==="cloud")return "Маълумотлар Telegram ҳисобингизда сақланяпти.";
  if(sync==="wait")return "Маълумотлар юкланяпти…";
  return inTg?"Telegram сақлаши ҳозир ишламаяпти. Ёзувлар шу қурилмада турибди.":"Маълумотлар фақат шу қурилмада сақланяпти. Тўлиқ сақлаш учун Telegram орқали очинг.";
}
function pullCloud(){
  if(!cloud)return;
  var done=false,guard=setTimeout(function(){if(!done){done=true;setSync("local")}},8000);
  function fin(ok){if(done)return;done=true;clearTimeout(guard);setSync(ok?"cloud":"local")}
  try{
    cloud.getKeys(function(err,keys){
      if(err||!Array.isArray(keys))return fin(false);
      var ks=keys.filter(function(k){return k==="profile"||/^m\d{6}$/.test(k)});
      if(!ks.length){if(hasData(state)){monthKeys(state).forEach(function(k){dirtyKeys[k]=1});if(state.profile)dirtyKeys.profile=1;flush()}return fin(true)}
      cloud.getItems(ks,function(err2,vals){
        if(err2||!vals)return fin(false);
        var remote={days:{},weights:{},wu:{},waist:{},bu:{},profile:null,updated:0};
        ks.forEach(function(k){var raw=vals[k];if(!raw)return;if(k==="profile"){try{remote.profile=validProfile(JSON.parse(raw))}catch(e){}}else readMonth(k,raw,remote)});
        var before=JSON.stringify(state);
        state=merge(state,remote);saveLocal();
        monthKeys(state).forEach(function(k){if(valueFor(k)!==vals[k])dirtyKeys[k]=1});
        if(state.profile&&valueFor("profile")!==vals.profile)dirtyKeys.profile=1;
        if(Object.keys(dirtyKeys).length)flush();
        fin(true);
        if(JSON.stringify(state)!==before){if(remote.profile)draft=null;render()}
      });
    });
  }catch(e){fin(false)}
}

/* personal plan */
function weightEntries(){return Object.keys(state.weights).sort().map(function(k){return [k,+state.weights[k]]}).filter(function(e){return e[1]>0})}
function lastWeight(){var e=weightEntries();return e.length?e[e.length-1][1]:null}
function minGoalFor(h){return Math.ceil(20*(h/100)*(h/100))}
function derive(){
  var p=state.profile;if(!p)return null;
  var w=lastWeight()||p.w0,m=p.h/100,bmi=w/(m*m);
  var bmr=10*w+6.25*p.h-5*p.age+(p.sex==="f"?-161:5),tdee=bmr*[1.35,1.5,1.65][p.act-1];
  var floor=p.sex==="f"?1400:1700,mode,target;
  if(p.health){mode="care";target=tdee}
  else if(p.goal<w-0.2&&p.goal>=minGoalFor(p.h)){mode="lose";target=Math.max(floor,tdee-500)}
  else{mode="keep";target=tdee}
  target=Math.round(target/50)*50;
  var level=target<=1750?1:target<=2150?2:3;
  return {w:w,bmi:bmi,cat:bmi<18.5?"вазн етишмайди":bmi<25?"меъёрда":bmi<30?"ортиқча вазн":"семизлик",mode:mode,target:target,level:level,
    stepGoal:[6000,8000,10000][p.act-1],protein:Math.round(1.4*Math.min(w,Math.max(p.goal,minGoalFor(p.h)))/5)*5,start:p.w0,goal:p.goal,
    weeks:mode==="lose"?Math.max(1,Math.round((w-p.goal)/0.5)):0};
}
function fill(s,lv){var L=LEVELS[lv];return s.replace(/\{(\w)\}/g,function(_,k){return L[k]!==undefined?L[k]:""})}
function curMenu(){var d=derive(),lv=d?d.level:2;return MENU.map(function(day){return day.map(function(s){return fill(s,lv)})})}
function score(d){var s=0,i,dv=derive(),sg=dv?dv.stepGoal:10000;for(i=0;i<4;i++)s+=d.meals[i]?1:0;for(i=0;i<5;i++)s+=d.habits[i]?1:0;if(d.steps>=sg)s++;return s}
function streak(){var k=todayKey(),n=0;if(score(getDay(k))<6)k=shift(k,-1);while(state.days[k]&&score(getDay(k))>=6){n++;k=shift(k,-1)}return n}
function bestStreak(){var ks=Object.keys(state.days).sort(),best=0,run=0,prev=null;ks.forEach(function(k){if(score(getDay(k))>=6){run=(prev&&shift(prev,1)===k)?run+1:1;prev=k;if(run>best)best=run}else{run=0;prev=null}});return best}

function fmt(n){return (Math.round(n*10)/10).toString().replace(".",",")}
function num(n){return Math.round(n).toLocaleString("ru-RU")}
function chartOf(e,lines,unit,empty){
  if(e.length<2)return '<p class="muted" style="margin:0">'+empty+'</p>';
  var W=320,H=130,L=8,R=52,T=16,B=14;
  var vals=e.map(function(x){return x[1]});
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  lines.forEach(function(l){lo=Math.min(lo,l.v);hi=Math.max(hi,l.v)});
  lo-=1;hi+=1;
  var t0=parse(e[0][0]).getTime(),t1=parse(e[e.length-1][0]).getTime(),span=Math.max(1,t1-t0);
  function X(k){return L+(W-L-R)*(parse(k).getTime()-t0)/span}
  function Y(v){return T+(H-T-B)*(hi-v)/(hi-lo)}
  var pts=e.map(function(x){return X(x[0]).toFixed(1)+","+Y(x[1]).toFixed(1)});
  var last=e[e.length-1],lx=X(last[0]),ly=Y(last[1]),lblY=ly+4,h="";
  lines.forEach(function(l){var gy=Y(l.v);if(Math.abs(ly-gy)<14)lblY=ly-10;h+='<path d="M'+L+' '+gy.toFixed(1)+'H'+(W-R)+'" stroke="var(--hot)" stroke-width="1.5" stroke-dasharray="4 4"></path><text x="'+(W-R+4)+'" y="'+(gy+4).toFixed(1)+'" font-size="11" fill="var(--hot)" font-weight="700">'+fmt(l.v)+' '+unit+'</text>'});
  var area="M"+pts[0]+" L"+pts.join(" L")+" L"+lx.toFixed(1)+","+(H-B)+" L"+L+","+(H-B)+" Z";
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="График: охирги қиймат '+fmt(last[1])+' '+unit+'" style="display:block">'+h
   +'<path d="'+area+'" fill="var(--tint)"></path>'
   +'<polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>'
   +'<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"></circle>'
   +'<text x="'+(lx+8).toFixed(1)+'" y="'+lblY.toFixed(1)+'" font-size="12" fill="var(--ink)" font-weight="700">'+fmt(last[1])+'</text>'
   +'</svg>';
}

function tree(sc,g,wilt,pop){

  for(i=0;i<10;i++){var on=i<sc,L=LF[i];h+='<g transform="rotate('+L[2]+' '+L[0]+' '+L[1]+')"><ellipse'+(pop&&i===sc-1?' class="pop"':'')+' cx="'+L[0]+'" cy="'+L[1]+'" rx="9" ry="15" fill="'+(on?lit:"none")+'" stroke="'+(on?lit:"var(--muted)")+'" stroke-opacity="'+(on?1:0.45)+'" stroke-width="1.5"></ellipse></g>'}

  return h+'</g></g></svg>';

function meyorScore(){

function submitProfile(){

  if(!(age>=1))return fail("Ёшингизни киритинг.");

  if(!(h>=130&&h<=220))return fail("Бўйни сантиметрда киритинг, масалан 174.");
  if(!(w>=35&&w<=250))return fail("Вазнни килограммда киритинг, масалан 94.");
  var m=h/100,bmi=w/(m*m),minG=minGoalFor(h),note="";

  else{
    if(!(goal>0))goal=Math.max(minG,Math.round(w*0.9));

}

   +'<button class="iconbtn" data-act="next" aria-label="Кейинги кун"'+(isToday?' disabled':'')+'><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button></div>';

  h+='<section class="card'+(sc>=10?" done":"")+'"><div class="summary">'+ring(sc,10)+'<div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1"><div style="font-weight:700">'+(sc>=10?"Аъло! 10 дан 10":"Кунлик натижа")+'</div><div class="muted">4 овқат, 5 одат ва қадам</div>'
   +(gp!==null?'<div class="muted">Вазн: '+fmt(dv.w)+' → '+fmt(dv.goal)+' кг · йўлнинг '+gp+'%</div><div class="bar"><i style="width:'+gp+'%"></i></div>':'<div class="muted">Вазн: '+fmt(dv.w)+' кг · '+LEVELS[dv.level].name.toLowerCase()+'</div>')
   +'</div></div></section>';
  h+=treeCard(d,sc);
  h+='<section class="card"><h2>Бугунги овқат</h2>';
  var nextI=-1,i;if(isToday){for(i=0;i<4;i++){if(!d.meals[i]){nextI=i;break}}}
  for(i=0;i<4;i++){h+='<button class="tick'+(i===nextI?" next":"")+'" data-act="meal" data-i="'+i+'" aria-pressed="'+(d.meals[i]?"true":"false")+'">'+mealIcon(i)+'<span class="lab"><span class="k">'+MEALS[i]+(i===nextI?" · кейинги қадам":"")+'</span><span class="v">'+mealHtml(menu[i])+'</span></span>'+check()+'</button>'}
  h+='</section>';
  h+='<section class="card"><h2>Одатлар</h2>';
  for(i=0;i<5;i++){h+='<button class="tick" data-act="habit" data-i="'+i+'" aria-pressed="'+(d.habits[i]?"true":"false")+'"><span class="lab"><span class="v">'+HABITS[i]+'</span></span>'+check()+'</button>'}
  h+='</section>';
  var pct=Math.min(100,Math.round(d.steps/dv.stepGoal*100));
  h+='<section class="card"><div class="row between"><h2>Қадам</h2><span class="muted">'+num(d.steps)+' / '+num(dv.stepGoal)+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>'
   +'<div class="field"><label for="steps-input" class="muted" style="flex:none">Жами</label><input id="steps-input" type="number" inputmode="numeric" min="0" max="80000" step="100" value="'+(d.steps||"")+'" placeholder="0"><button class="pillbtn" data-act="addsteps">+1000</button></div></section>';
  h+='<section class="card"><h2>Бугун бўлдими?</h2><div class="chips">';
  FLAGS.forEach(function(f){h+='<button class="chip'+(f[2]?" good":"")+'" data-act="flag" data-k="'+f[0]+'" aria-pressed="'+(d[f[0]]?"true":"false")+'">'+f[1]+'</button>'});
  h+='</div><div class="muted">Ҳафталик ҳисоб «Ҳафта» бўлимида.</div></section>';
  var w=+state.weights[sel]||0,bw=+state.waist[sel]||0;
  h+='<section class="card"><div class="row between"><h2>Вазн ва бел</h2><span class="muted">ҳафтада 1 марта, оч қоринга</span></div><div class="field"><input id="weight-input" type="text" inputmode="decimal" value="'+(w?fmt(w):"")+'" placeholder="вазн, масалан '+fmt(dv.w)+'" aria-label="Вазн, кг"><span class="muted" style="flex:none;width:22px">кг</span><button class="pillbtn primary" data-act="saveweight">Сақлаш</button></div>'
   +'<div class="field"><input id="waist-input" type="text" inputmode="decimal" value="'+(bw?fmt(bw):"")+'" placeholder="бел, масалан '+waistLimits()[0]+'" aria-label="Бел айланаси, см"><span class="muted" style="flex:none;width:22px">см</span><button class="pillbtn" data-act="savewaist">Сақлаш</button></div><div class="muted">Бел киндик сатҳида, нафас чиқаргандан кейин ўлчанади.</div>'+chart()+'</section>';
  var day=Math.floor(parse(sel).getTime()/864e5);
  h+='<div class="proverb">'+PROVERBS[((day%PROVERBS.length)+PROVERBS.length)%PROVERBS.length]+'</div>';
  h+='<p class="muted" id="sync" style="margin:0;text-align:center">'+syncText()+'</p>';
  return h;
}
function viewWeek(){
  var dv=derive(),ks=weekKeys(sel),h="",tot={osh:0,dough:0,gym:0},steps=0,stepDays=0,tk=todayKey();
  h+='<h1>Ҳафта</h1><div class="muted">'+parse(ks[0]).getDate()+'-'+MONTHS[parse(ks[0]).getMonth()]+' — '+parse(ks[6]).getDate()+'-'+MONTHS[parse(ks[6]).getMonth()]+'</div>';
  h+=scoreCard();
  h+='<section class="card"><h2>Кунлик бажарилиш</h2><div class="week">';
  ks.forEach(function(k,i){var d=getDay(k),s=score(d);tot.osh+=d.osh?1:0;tot.dough+=d.dough?1:0;tot.gym+=d.gym?1:0;if(d.steps>0){steps+=d.steps;stepDays++}
    h+='<button class="wd'+(k===sel?" sel":"")+'" data-act="goto" data-k="'+k+'"'+(k>tk?" disabled":"")+' aria-label="'+DAYS[i]+': '+s+' / 10"><b>'+DSHORT[i]+'</b><span class="col"><i style="height:'+(s*10)+'%"></i></span><span>'+s+'/10</span></button>'});
  h+='</div><div class="muted">Кунни босиб, уни очинг.</div></section>';
  h+='<section class="card"><h2>Ҳафталик ҳисоб</h2>';
  h+='<div class="dns">'+donut(tot.osh,1,tot.osh>1,false,"Ош",tot.osh>1?"ошиб кетди":"меъёр 1 марта")+donut(tot.dough,2,tot.dough>2,false,"Хамир, қовурма",tot.dough>2?"ошиб кетди":"меъёр 2 марта")+donut(tot.gym,3,false,tot.gym>=2,"Куч машқи",tot.gym>=2?"бажарилди":"мақсад 2–3")+'</div>';
  h+='<div class="stat"><div><div style="font-weight:600">Ўртача қадам</div><div class="muted">мақсад: '+num(dv.stepGoal)+'</div></div><span class="big" style="font-size:20px">'+(stepDays?num(steps/stepDays):"—")+'</span></div>';
  h+='</section>';
  var bs=bestStreak(),lost=dv.start-dv.w,any=Object.keys(state.days).some(function(k){return score(getDay(k))>=1});
  var bd=[["Биринчи кун",any],["3 кун кетма-кет",bs>=3],["7 кун кетма-кет",bs>=7],["30 кун кетма-кет",bs>=30]];
  if(dv.mode==="lose"||lost>=1){bd.push(["−1 кг",lost>=1],["−3 кг",lost>=3],["−5 кг",lost>=5]);if(dv.mode==="lose")bd.push(["Мақсадга етдим",dv.w<=dv.goal+0.05])}
  h+='<section class="card"><h2>Ютуқлар</h2><div class="chips">';
  bd.forEach(function(b){h+='<span class="badge'+(b[1]?" on":"")+'">'+(b[1]?'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>':'')+b[0]+(b[1]?'':' · ҳали эмас')+'</span>'});
  h+='</div><div class="muted">Кун ҳисобга олиниши учун 10 дан камида 6 балл керак.</div></section>';
  h+=heatCard();
  var e=weightEntries();
  h+='<section class="card"><h2>Вазн</h2>';
  if(e.length){var diff=dv.w-dv.start;h+='<div class="row between"><div><div class="big">'+fmt(dv.w)+' кг</div><div class="muted">бошланиш '+fmt(dv.start)+' кг</div></div><span class="state'+(diff>0.05&&dv.mode==="lose"?" over":"")+'">'+(diff>0?"+":"")+fmt(diff)+' кг</span></div>';
    if(dv.mode==="lose"){var left=dv.w-dv.goal;h+='<div class="muted">'+(left>0.05?"Мақсадгача "+fmt(left)+" кг қолди.":"Мақсадга етдингиз.")+'</div>'}}
  h+=chart()+'</section>';
  var be=waistEntries(),wl=waistLimits();
  h+='<section class="card"><h2>Бел айланаси</h2>';
  if(be.length){var bc=be[be.length-1][1],bd0=bc-be[0][1];h+='<div class="row between"><div><div class="big">'+fmt(bc)+' см</div><div class="muted">'+(be.length>1?"бошидан "+(bd0>0?"+":"")+fmt(bd0)+" см":"биринчи ўлчов")+'</div></div><span class="state'+(bc>=wl[0]?" over":"")+'">'+(bc<wl[0]?"меъёрда":bc<wl[1]?"хавф ортган":"юқори хавф")+'</span></div>'}
  h+='<div class="muted">Бел айланаси қорин ёғини вазндан кўра аниқроқ кўрсатади. '+(state.profile.sex==="f"?"Аёлларда 80 см дан":"Эркакларда 94 см дан")+' паст бўлиши тавсия этилади.</div>'+waistChart()+'</section>';
  return h;
}
function viewMenu(){
  var dv=derive(),menu=curMenu(),t=dow(todayKey()),L=LEVELS[dv.level];
  var h='<h1>7 кунлик таомнома</h1><div class="muted">'+L.name+': суюқ овқат 1 коса, гўшт '+L.M+' г, '+L.N+', чой шакарсиз.</div>';
  for(var i=0;i<7;i++){h+='<section class="card menuday"><div class="row between"><h2>'+DAYS[i]+'</h2>'+(i===t?'<span class="today-mark">бугун</span>':'')+'</div><dl>';
    for(var j=0;j<4;j++)h+='<dt>'+MEALS[j]+'</dt><dd>'+mealHtml(menu[i][j])+'</dd>';
    h+='</dl></section>'}
  h+='<section class="card"><h2>Кўчада ва кафеда танлов</h2><div><b style="color:var(--accent)">Яхши.</b> Шўрва, мастава, мошхўрда, димлама, ёғсиз шашлик, гриль товуқ, 1 та товуқли лаваш ёки шаурма.</div><div><b style="color:var(--hot)">Ҳафтада 1–2 марта.</b> 1 та тандир сомса салат билан, ярим порция лағмон ёки норин, манти.</div><div><b>Чекланг.</b> Комбо (бургер, фри, кола), хот-дог, чебурек, гумма, қозон кабоб, майонезли салатлар.</div><div class="muted">Ичимлик: сув, шакарсиз кўк чой, айрон.</div></section>';
  return h;
}
function viewProfile(){
  if(!draft)draft=draftFrom(state.profile);
  var dv=derive(),p=state.profile,L=LEVELS[dv.level],h="";
  h+=band(false,'<div class="hello">'+(p.name?esc(p.name)+", сизнинг":"Сизнинг")+' режангиз</div>');
  h+='<section class="card"><h2>Режа</h2>';
  if(dv.mode==="lose")h+='<div class="note">Мақсад: '+fmt(dv.w)+' → '+fmt(dv.goal)+' кг. Суръат ҳафтасига тахминан 0,5 кг, бу '+dv.weeks+' ҳафта атрофида.</div>';
  else if(dv.mode==="care")h+='<div class="err">Соғлиқ ҳолатингиз сабабли озиш режаси берилмайди. Овқатланишни ўзгартиришдан олдин шифокор билан маслаҳатлашинг. Таомнома умумий соғлом овқатланиш намунаси.</div>';
  else if(dv.bmi<18.5)h+='<div class="err">Вазнингиз меъёрдан паст. Озиш режаси берилмайди, шифокор билан маслаҳатлашинг.</div>';
  else h+='<div class="note">Режа: вазнни сақлаш ва соғлом овқатланиш.'+(dv.bmi<25?" Вазнингиз меъёрда.":"")+'</div>';
  h+='<div class="kv"><div><b>'+fmt(dv.bmi)+'</b><span>ТВИ · '+dv.cat+'</span></div><div><b>≈'+num(dv.target)+' ккал</b><span>кунлик меъёр</span></div><div><b>'+L.name+'</b><span>гўшт '+L.M+' г, '+L.N+'</span></div><div><b>'+num(dv.stepGoal)+'</b><span>кунлик қадам</span></div><div><b>≈'+dv.protein+' г</b><span>кунлик оқсил</span></div><div><b>5 та</b><span>кунлик одат</span></div></div>';
  h+='<a class="pillbtn primary cta" href="#today" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Бугунги режага ўтиш</a>';
  if(inTg&&typeof tg.addToHomeScreen==="function"&&atLeast("8.0"))h+='<button class="pillbtn" data-act="home">Телефон бош экранига қўшиш</button>';
  h+='</section>';
  h+='<section class="card"><h2>Маълумотларим</h2><div class="muted">Ўзгартирсангиз, режа қайта ҳисобланади.</div>'+formHtml(false)+'</section>';
  h+='<p class="muted" style="margin:0;text-align:center">Меъёр тиббий маслаҳат ўрнини босмайди. Сурункали касаллик бўлса, шифокор билан маслаҳатлашинг.</p>';
  h+='<p class="muted" id="sync" style="margin:0;text-align:center">'+syncText()+'</p>';
  return h;
}
function tab(){if(!state.profile)return "start";var h=(location.hash||"").replace("#","");return h==="week"||h==="menu"||h==="profile"||h==="body"?h:"today"}
function render(){
  var t=tab(),v=document.getElementById("view"),top=v.scrollTop,act=document.activeElement,fid=act&&act.id,isText=act&&act.tagName==="INPUT"&&act.type==="text";
  v.innerHTML=t==="start"?viewStart():t==="week"?viewWeek():t==="menu"?viewMenu():t==="profile"?viewProfile():t==="body"?viewBody():viewToday();
  v.scrollTop=top;
  if(fid){var el=document.getElementById(fid);if(el&&el!==document.activeElement){el.focus();if(isText){try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}}
  document.getElementById("nav").hidden=t==="start";
  ["today","week","menu","body","profile"].forEach(function(n){var a=document.getElementById("tab-"+n);if(n===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
}
function saveWaist(){
  var el=document.getElementById("waist-input");if(!el)return;
  var raw=el.value.trim().replace(",",".");
  if(raw===""){if(+state.waist[sel]>0){state.waist[sel]=0;state.bu[sel]=Date.now();touch(mkey(sel))}return}
  var n=Math.round(parseFloat(raw)*10)/10;
  if(!(n>=40&&n<=200)){el.focus();return}
  if(+state.waist[sel]===n)return;
  state.waist[sel]=n;state.bu[sel]=Date.now();touch(mkey(sel));
}
function saveSteps(val){var n=Math.round(+val);if(!(n>=0)||n>80000)return;var d=getDay(sel);if(d.steps===n)return;d.steps=n;setDay(sel,d)}
function saveWeight(){
  var el=document.getElementById("weight-input");if(!el)return;
  var raw=el.value.trim().replace(",",".");
  if(raw===""){if(+state.weights[sel]>0){state.weights[sel]=0;state.wu[sel]=Date.now();touch(mkey(sel))}return}
  var n=Math.round(parseFloat(raw)*10)/10;
  if(!(n>=35&&n<=250)){el.focus();return}
  if(+state.weights[sel]===n)return;
  state.weights[sel]=n;state.wu[sel]=Date.now();touch(mkey(sel));
}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act"),d=getDay(sel),i;
  if(a==="meal"){i=+b.getAttribute("data-i");d.meals[i]=d.meals[i]?0:1;haptic();setDay(sel,d)}
  else if(a==="habit"){i=+b.getAttribute("data-i");d.habits[i]=d.habits[i]?0:1;haptic();setDay(sel,d)}
  else if(a==="flag"){var k=b.getAttribute("data-k");d[k]=d[k]?0:1;haptic();setDay(sel,d)}
  else if(a==="addsteps"){d.steps=Math.min(80000,(d.steps||0)+1000);setDay(sel,d)}
  else if(a==="saveweight"){saveWeight()}
  else if(a==="savewaist"){saveWaist()}
  else if(a==="food"){food=+b.getAttribute("data-i")||0;render()}
  else if(a==="home"){try{tg.addToHomeScreen()}catch(e){}}
  else if(a==="prev"){sel=shift(sel,-1);render()}
  else if(a==="next"){if(sel<todayKey()){sel=shift(sel,1);render()}}
  else if(a==="today"){sel=todayKey();render()}
  else if(a==="goto"){sel=b.getAttribute("data-k");if(tab()==="today")render();else location.hash="#today"}
});
document.addEventListener("input",function(ev){
  var t=ev.target,id=t.id||"";
  if(!draft||id.indexOf("pf-")!==0)return;
  if(id==="pf-name")draft.name=t.value;else if(id==="pf-age")draft.age=t.value;else if(id==="pf-h")draft.h=t.value;else if(id==="pf-w")draft.w=t.value;else if(id==="pf-goal")draft.goal=t.value;
});
document.addEventListener("change",function(ev){
  var t=ev.target,id=t.id||"";
  if(id==="steps-input")saveSteps(t.value||0);
  else if(id==="weight-input")saveWeight();
  else if(id==="waist-input")saveWaist();
  else if(draft&&t.name==="pf-sex"){draft.sex=t.value;render()}
  else if(draft&&t.name==="pf-act"){draft.act=t.value;render()}
  else if(draft&&id==="pf-health"){draft.health=t.checked}
});
document.addEventListener("submit",function(ev){ev.preventDefault();if(ev.target.id==="pf")submitProfile()});
window.addEventListener("hashchange",function(){document.getElementById("view").scrollTop=0;if(tab()==="profile"){draft=draftFrom(state.profile);if(!keepErr)formErr=""}keepErr=false;render()});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")flush()});

if(inTg){
  try{tg.ready();tg.expand()}catch(e){}
  try{if(atLeast("6.1"))tg.setHeaderColor("#123E6E")}catch(e){}
  applyTheme();
  try{tg.onEvent("themeChanged",applyTheme)}catch(e){}
}
loadLocal();
render();
pullCloud();
})();
</script>
</body>
</html>
